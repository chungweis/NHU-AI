<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南華AI系群島 - 3D 智慧微縮模型城市</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js for 3D Miniature Model World -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for smooth UI animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        toy: {
                            blue: '#3b82f6',
                            green: '#10b981',
                            amber: '#f59e0b',
                            rose: '#f43f5e',
                            purple: '#8b5cf6',
                            cream: '#fef3c7',
                            sand: '#fefce8',
                            earth: '#78350f'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            outline: none;
        }
        .glass-panel {
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -5px rgba(59, 130, 246, 0.25);
        }
        /* 3D Floating Tag attached to islands */
        #island-tooltip {
            position: absolute;
            transform: translate(-50%, -120%);
            z-index: 30;
            pointer-events: auto;
            transition: opacity 0.25s ease, transform 0.25s ease;
            opacity: 0;
            pointer-events: none;
        }
        #island-tooltip.active {
            opacity: 1;
            pointer-events: auto;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
        }
        .pulse-dot {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="h-full w-full relative select-none">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Floating 3D Island Tooltip (Appears right above/below the clicked 3D island) -->
    <div id="island-tooltip" class="glass-panel w-72 md:w-80 p-4 rounded-3xl shadow-2xl">
        <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-700/60">
            <div class="flex items-center gap-2">
                <div id="tooltip-icon-wrap" class="w-7 h-7 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-sm">
                    <i id="tooltip-icon" class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <span class="text-[9px] uppercase font-bold text-blue-400 tracking-wider">AI 系課程群組</span>
                    <h2 id="tooltip-title" class="text-xs md:text-sm font-black text-white">南華 AI 核心學群</h2>
                </div>
            </div>
            <button onclick="closeTooltip()" class="w-6 h-6 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <p id="tooltip-desc" class="text-[11px] text-slate-300 leading-relaxed mb-3">
          點擊 3D 模型群島中的任一六角島嶼，即可探索南華大學人工智慧應用學系的多元課程與實驗室專案。
        </p>
        <div class="space-y-2 mb-3" id="tooltip-channels">
            <!-- Dynamic channel items -->
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-slate-700/50">
            <a href="https://im3.nhu.edu.tw/Web/Index" target="_blank" class="text-[10px] text-blue-400 hover:text-blue-300 font-bold flex items-center gap-1">
                <i class="fa-solid fa-globe"></i> 官方網站 <i class="fa-solid fa-external-link-alt text-[8px]"></i>
            </a>
            <button onclick="openChannelModalFromTooltip()" class="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold shadow-md shadow-blue-500/20 transition-all">
                詳細資訊
            </button>
        </div>
    </div>

    <!-- UI Overlay Layer (Non-intrusive headers/footers that don't block the 3D islands) -->
    <div class="relative z-20 pointer-events-none h-full w-full flex flex-col justify-between p-3 md:p-6 overflow-hidden">
        
        <!-- Top Navigation & Header -->
        <header class="flex flex-col md:flex-row items-start md:items-center justify-between gap-2 pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-cube text-white text-base"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] uppercase tracking-wider font-semibold text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded-full border border-emerald-500/30">南華大學</span>
                        <span class="text-[10px] text-slate-400 hidden sm:inline">NHU AI Archipelagos</span>
                    </div>
                    <h1 class="text-sm md:text-xl font-black tracking-tight text-white">AI系群島 <span class="text-blue-400">3D 互動微縮模型</span></h1>
                </div>
            </div>

            <!-- Island Category Filters (Hex Toggles) -->
            <div class="glass-panel p-1.5 rounded-2xl flex items-center gap-1 md:gap-2 overflow-x-auto max-w-full pointer-events-auto">
                <button onclick="focusIslandCategory('all')" class="island-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white transition-all shadow-md shadow-blue-600/30 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-globe"></i> <span>全部群島</span>
                </button>
                <button onclick="focusIslandCategory('core')" class="island-filter-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> <span>核心主島</span>
                </button>
                <button onclick="focusIslandCategory('vision')" class="island-filter-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> <span>視覺智慧</span>
                </button>
                <button onclick="focusIslandCategory('data')" class="island-filter-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> <span>大數據</span>
                </button>
                <button onclick="focusIslandCategory('smart')" class="island-filter-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span> <span>物聯網</span>
                </button>
                <button onclick="focusIslandCategory('future')" class="island-filter-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-purple-500"></span> <span>前瞻創新</span>
                </button>
            </div>

            <!-- Quick Live Stats Counter -->
            <div class="glass-panel px-3 py-1.5 rounded-2xl hidden lg:flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-dot"></span>
                    <span class="text-xs text-slate-300">線上探索:</span>
                    <span class="text-xs font-black text-emerald-400">142</span>
                </div>
            </div>
        </header>

        <!-- Middle empty area so 3D islands are fully visible -->
        <main class="flex-1 flex flex-col items-center justify-center pointer-events-none my-auto">
            <div id="interaction-hint" class="glass-panel px-4 py-2 rounded-full text-xs font-medium text-slate-300 flex items-center gap-2 animate-bounce pointer-events-auto">
                <i class="fa-solid fa-hand-pointer text-blue-400"></i>
                <span>點擊任意 3D 六角島嶼查看專屬課程說明 • 拖曳旋轉視角</span>
            </div>
        </main>

        <!-- Bottom Footer Controls -->
        <footer class="flex items-center justify-between gap-3 pointer-events-auto">
            <div class="glass-panel px-3 py-2 rounded-2xl flex items-center gap-2 text-xs text-slate-300">
                <span class="font-bold text-white flex items-center gap-1"><i class="fa-solid fa-layer-group text-blue-400"></i> 群島圖例：</span>
                <div class="hidden sm:flex items-center gap-2 text-[11px]">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-blue-500"></span>核心</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-emerald-500"></span>視覺</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-amber-500"></span>大數據</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-rose-500"></span>物聯網</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-purple-500"></span>前瞻</span>
                </div>
            </div>

            <div class="glass-panel px-3 py-2 rounded-2xl flex items-center gap-2">
                <button onclick="resetCameraView()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition-all flex items-center gap-1 border border-slate-700">
                    <i class="fa-solid fa-rotate"></i> 重置視角
                </button>
                <button onclick="toggleAutoRotate()" id="autorotate-btn" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all flex items-center gap-1 shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-play"></i> 環視
                </button>
            </div>
        </footer>
    </div>

    <!-- Course / Channel Detail Modal -->
    <div id="channel-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel w-full max-w-lg p-6 rounded-3xl shadow-2xl relative transform scale-95 transition-all duration-300" id="channel-modal-content">
            <button onclick="closeChannelModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex items-center gap-3 mb-4">
                <div id="modal-icon-wrap" class="w-12 h-12 rounded-2xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl font-bold">
                    <i id="modal-icon" class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <span id="modal-category" class="text-[10px] uppercase font-bold text-blue-400 tracking-wider">AI 專業學群</span>
                    <h3 id="modal-title" class="text-lg font-black text-white">機器學習與深度學習</h3>
                </div>
            </div>
            <p id="modal-desc" class="text-xs text-slate-300 leading-relaxed mb-4">
                本課程群組著重於人工智慧核心演算法、神經網路架構設計與真實世界資料集之模型訓練。
            </p>
            <div class="space-y-2 mb-6" id="modal-channels-list">
                <!-- Detailed channels -->
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeChannelModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs font-bold">關閉</button>
                <a href="https://im3.nhu.edu.tw/Web/Index" target="_blank" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg shadow-blue-600/30 flex items-center gap-1.5">
                    <span>前往南華AI系官網</span> <i class="fa-solid fa-external-link-alt text-[10px]"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Three.js 3D Miniature Model Archipelago Script -->
    <script>
        const islandData = [
            {
                id: 'core',
                name: '南華 AI 核心學群',
                desc: '人工智慧應用學系主基石，涵蓋高等數學、線性代數、演算法與智慧系統架構基礎。',
                icon: 'fa-brain',
                accentColor: '#3b82f6',
                position: { x: 0, z: 0 },
                channels: [
                    { name: '機器學習與深度學習頻道', status: '進行中', desc: '神經網路模型訓練、PyTorch 影像辨識專題與智慧代理人實作。', students: 48 },
                    { name: '智慧型代理人與大模型應用', status: '熱門', desc: 'LLM 提示工程、RAG 檢索增強生成與自適應 AI 系統。', students: 52 }
                ]
            },
            {
                id: 'vision',
                name: '電腦視覺與影像辨識島',
                desc: '結合先進鏡頭與深度卷積網路，讓機器學會看見與理解真實世界。',
                icon: 'fa-eye',
                accentColor: '#10b981',
                position: { x: 5.5, z: -3.2 },
                channels: [
                    { name: '電腦視覺與影像處理', status: '進行中', desc: 'OpenCV 影像特徵擷取、YOLOv8 物件偵測與即時追蹤。', students: 41 },
                    { name: '醫療影像智慧辨識', status: '專案展示', desc: 'X光與MRI斷層掃描之AI輔助診斷模型研發。', students: 29 }
                ]
            },
            {
                id: 'data',
                name: '大數據與雲端運算島',
                desc: '海量資料探勘、分散式雲端架構與智慧商業預測模型。',
                icon: 'fa-database',
                accentColor: '#f59e0b',
                position: { x: -5.5, z: -3.2 },
                channels: [
                    { name: '大數據分析與探勘', status: '進行中', desc: 'Hadoop/Spark 分散式運算與消費者行為預測。', students: 38 },
                    { name: '雲端資料庫與系統維運', status: '實作中', desc: 'NoSQL 資料庫設計與 Docker 容器化微服務部署。', students: 34 }
                ]
            },
            {
                id: 'smart',
                name: 'Edge AI 與物聯網島',
                desc: '將AI演算法植入嵌入式晶片，實現智慧家居、無人車與智慧農業。',
                icon: 'fa-microchip',
                accentColor: '#f43f5e',
                position: { x: 5.5, z: 3.2 },
                channels: [
                    { name: 'Edge AI 與物聯網應用', status: '專案展示', desc: 'Raspberry Pi 與 Jetson Nano 之智慧感測邊緣運算。', students: 36 },
                    { name: '智慧機器人控制實習', status: '競賽中', desc: 'AGV 自走車避障導航與ROS機器人作業系統。', students: 30 }
                ]
            },
            {
                id: 'future',
                name: '前瞻AI與創新實驗島',
                desc: '探索生成式AI、元宇宙互動、人機介面與跨領域創新應用。',
                icon: 'fa-rocket',
                accentColor: '#8b5cf6',
                position: { x: -5.5, z: 3.2 },
                channels: [
                    { name: '生成式AI與數位藝術', status: '熱門', desc: 'Diffusion 擴散模型生成與互動式多媒體創作。', students: 45 },
                    { name: '產學專題實作與創業育成', status: '結案展演', desc: '與各大科技企業合作之 AI 商業解決方案提案。', students: 50 }
                ]
            }
        ];

        let scene, camera, renderer, raycaster, mouse;
        let islands = [];
        let isAutoRotate = false;
        let currentSelectedIsland = null;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1120);
            scene.fog = new THREE.FogExp2(0x0b1120, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 16);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
            sunLight.position.set(15, 25, 15);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const blueFill = new THREE.DirectionalLight(0x3b82f6, 0.5);
            blueFill.position.set(-15, 10, -15);
            scene.add(blueFill);

            const waterGeo = new THREE.PlaneGeometry(100, 100);
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.2,
                metalness: 0.8
            });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.8;
            scene.add(water);

            islandData.forEach((data) => {
                const islandGroup = createHexIsland(data);
                islandGroup.position.set(data.position.x, 0, data.position.z);
                islandGroup.userData = data;
                scene.add(islandGroup);
                islands.push(islandGroup);
            });

            window.addEventListener('resize', onWindowResize);

            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let hasMoved = false;

            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                hasMoved = false;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
                    hasMoved = true;
                }
                scene.rotation.y += deltaX * 0.005;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('pointerup', (e) => {
                isDragging = false;
                if (!hasMoved) {
                    handleCanvasClick(e);
                }
            });

            animate();
        }

        function createHexIsland(data) {
            const group = new THREE.Group();
            const radius = 3.2;
            const height = 1.2;

            const hexShape = new THREE.Shape();
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI) / 3;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                if (i === 0) hexShape.moveTo(x, y);
                else hexShape.lineTo(x, y);
            }

            const extrudeSettings = {
                depth: height,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.1,
                bevelThickness: 0.1
            };

            const geom = new THREE.ExtrudeGeometry(hexShape, extrudeSettings);
            geom.rotateX(Math.PI / 2);

            const baseColor = data.id === 'core' ? 0x2563eb : 
                              data.id === 'vision' ? 0x059669 : 
                              data.id === 'data' ? 0xd97706 : 
                              data.id === 'smart' ? 0xe11d48 : 0x7c3aed;

            const mat = new THREE.MeshStandardMaterial({
                color: baseColor,
                roughness: 0.4,
                metalness: 0.1
            });

            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.y = -height;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            const topGeo = new THREE.CylinderGeometry(radius * 0.95, radius * 0.95, 0.1, 6);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const topMesh = new THREE.Mesh(topGeo, topMat);
            topMesh.position.y = 0.05;
            topMesh.receiveShadow = true;
            group.add(topMesh);

            const buildingMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3, metalness: 0.2 });
            const accentMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.2 });

            for (let i = 0; i < 3; i++) {
                const bWidth = 0.6 + Math.random() * 0.6;
                const bHeight = 1.0 + Math.random() * 1.5;
                const bDepth = 0.6 + Math.random() * 0.6;
                const bGeom = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
                const bMesh = new THREE.Mesh(bGeom, i === 0 ? accentMat : buildingMat);
                
                const angle = (i / 3) * Math.PI * 2 + 0.5;
                const dist = 1.0;
                bMesh.position.set(Math.cos(angle) * dist, bHeight / 2, Math.sin(angle) * dist);
                bMesh.castShadow = true;
                bMesh.receiveShadow = true;
                group.add(bMesh);
            }

            const ringGeo = new THREE.RingGeometry(0.8, 1.0, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: baseColor, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 2.8;
            ring.name = 'ring';
            group.add(ring);

            return group;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function handleCanvasClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(islands, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.id) {
                    obj = obj.parent;
                }
                if (obj.userData.id) {
                    currentSelectedIsland = obj.userData;
                    showIslandTooltip(obj, currentSelectedIsland);
                    
                    gsap.to(camera.position, {
                        x: obj.position.x * 1.2,
                        y: 11,
                        z: obj.position.z + 13,
                        duration: 1.0,
                        ease: 'power2.out',
                        onUpdate: () => camera.lookAt(obj.position.x, 0, obj.position.z)
                    });
                }
            } else {
                closeTooltip();
            }
        }

        function showIslandTooltip(islandMesh, data) {
            const tooltip = document.getElementById('island-tooltip');
            
            document.getElementById('tooltip-title').textContent = data.name;
            document.getElementById('tooltip-desc').textContent = data.desc;
            document.getElementById('tooltip-icon').className = `fa-solid ${data.icon}`;
            document.getElementById('tooltip-icon-wrap').style.color = data.accentColor;
            document.getElementById('tooltip-icon-wrap').style.background = `${data.accentColor}20`;

            const channelsContainer = document.getElementById('tooltip-channels');
            channelsContainer.innerHTML = '';
            data.channels.forEach(ch => {
                channelsContainer.innerHTML += `
                    <div class="p-2 rounded-xl bg-slate-800/60 border border-slate-700/50 text-[11px]">
                        <div class="flex items-center justify-between font-bold text-white mb-0.5">
                            <span>${ch.name}</span>
                            <span class="text-[9px] px-1.5 py-0.2 rounded" style="color: ${data.accentColor}; background: ${data.accentColor}20">${ch.status}</span>
                        </div>
                        <p class="text-slate-400 text-[10px] truncate">${ch.desc}</p>
                    </div>
                `;
            });

            tooltip.classList.add('active');
            updateTooltipPosition(islandMesh);
        }

        function updateTooltipPosition(mesh) {
            if (!currentSelectedIsland) return;
            const islandObj = islands.find(i => i.userData.id === currentSelectedIsland.id);
            if (!islandObj) return;

            const vector = new THREE.Vector3(islandObj.position.x, 2.5, islandObj.position.z);
            vector.project(camera);

            const x = (vector.x *  .5 + .5) * window.innerWidth;
            const y = (vector.y * -.5 + .5) * window.innerHeight;

            const tooltip = document.getElementById('island-tooltip');
            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y}px`;
        }

        function closeTooltip() {
            const tooltip = document.getElementById('island-tooltip');
            tooltip.classList.remove('active');
            currentSelectedIsland = null;
        }

        function focusIslandCategory(categoryId) {
            if (categoryId === 'all') {
                resetCameraView();
                closeTooltip();
            } else {
                const found = islandData.find(i => i.id === categoryId);
                if (found) {
                    const islandObj = islands.find(i => i.userData.id === categoryId);
                    if (islandObj) {
                        currentSelectedIsland = found;
                        showIslandTooltip(islandObj, found);
                        gsap.to(camera.position, {
                            x: islandObj.position.x * 1.2,
                            y: 11,
                            z: islandObj.position.z + 13,
                            duration: 1.2,
                            ease: 'power2.out',
                            onUpdate: () => {
                                camera.lookAt(islandObj.position.x, 0, islandObj.position.z);
                                updateTooltipPosition(islandObj);
                            }
                        });
                    }
                }
            }
        }

        function resetCameraView() {
            gsap.to(camera.position, { x: 0, y: 14, z: 16, duration: 1.2, ease: 'power2.out', onUpdate: () => camera.lookAt(0, 0, 0) });
            scene.rotation.y = 0;
            closeTooltip();
        }

        function toggleAutoRotate() {
            isAutoRotate = !isAutoRotate;
            const btn = document.getElementById('autorotate-btn');
            if (isAutoRotate) {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> 停止';
                btn.className = 'px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all flex items-center gap-1 shadow-lg shadow-emerald-600/30';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> 環視';
                btn.className = 'px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all flex items-center gap-1 shadow-lg shadow-blue-600/30';
            }
        }

        function openChannelModalFromTooltip() {
            if (!currentSelectedIsland) return;
            const data = currentSelectedIsland;
            document.getElementById('modal-title').textContent = data.name;
            document.getElementById('modal-desc').textContent = data.desc;
            document.getElementById('modal-icon').className = `fa-solid ${data.icon}`;
            document.getElementById('modal-icon-wrap').style.color = data.accentColor;
            document.getElementById('modal-icon-wrap').style.background = `${data.accentColor}20`;

            const list = document.getElementById('modal-channels-list');
            list.innerHTML = '';
            data.channels.forEach(ch => {
                list.innerHTML += `
                    <div class="p-3 rounded-2xl bg-slate-800/60 border border-slate-700/50 text-xs">
                        <div class="flex items-center justify-between font-bold text-white mb-1">
                            <span>${ch.name}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded" style="color: ${data.accentColor}; background: ${data.accentColor}20">${ch.status}</span>
                        </div>
                        <p class="text-slate-300 text-[11px] mb-1.5">${ch.desc}</p>
                        <div class="text-[10px] text-slate-400">參與學生: ${ch.students} 人</div>
                    </div>
                `;
            });

            const modal = document.getElementById('channel-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-95');
            modal.querySelector('.transform').classList.add('scale-100');
        }

        function closeChannelModal() {
            const modal = document.getElementById('channel-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.add('scale-95');
            modal.querySelector('.transform').classList.remove('scale-100');
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isAutoRotate) {
                scene.rotation.y += 0.003;
            }

            islands.forEach((island, i) => {
                const ring = island.getObjectByName('ring');
                if (ring) {
                    ring.rotation.z += 0.01;
                    ring.position.y = 2.8 + Math.sin(Date.now() * 0.003 + i) * 0.15;
                }
            });

            if (currentSelectedIsland) {
                const islandObj = islands.find(i => i.userData.id === currentSelectedIsland.id);
                if (islandObj) {
                    updateTooltipPosition(islandObj);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
